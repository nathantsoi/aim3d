<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aim3d - Parametric CAD/CAM Platform</title>
  <style>
    /* Premium Aesthetic Styling (Dark Mode, harmonious HSL tones, glassmorphism) */
    :root {
      --bg-base: hsl(220, 20%, 10%);
      --bg-surface: hsla(220, 15%, 15%, 0.7);
      --bg-panel: hsla(220, 15%, 20%, 0.85);
      --border-color: hsla(220, 15%, 25%, 0.4);
      
      --accent: hsl(200, 100%, 50%);
      --accent-hover: hsl(200, 100%, 60%);
      --accent-dim: hsla(200, 100%, 50%, 0.15);
      
      --text-main: hsl(220, 10%, 90%);
      --text-muted: hsl(220, 10%, 65%);
      --text-danger: hsl(0, 85%, 65%);
      
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
      --transition-smooth: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-family);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Bar */
    header {
      background: linear-gradient(180deg, var(--bg-surface) 0%, transparent 100%);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 14px;
      height: 14px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin: 0;
      background: linear-gradient(90deg, var(--text-main) 0%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }


    /* Main Scaffold Grid */
    #app {
      display: grid;
      grid-template-columns: var(--left-panel-width, 280px) 4px 1fr 4px var(--right-panel-width, 340px);
      grid-template-rows: 100%;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .resizer {
      background-color: transparent;
      cursor: col-resize;
      z-index: 10;
      transition: background-color 0.15s;
    }

    .resizer:hover, .resizer.dragging {
      background-color: var(--accent);
    }

    /* Bottom bar holds its height and never gets squeezed by the grid */
    #timeline-bar {
      flex-shrink: 0;
    }

    /* Standard panels */
    .app-panel {
      background-color: var(--bg-panel);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      z-index: 5;
    }

    .app-panel.right {
      border-right: none;
      border-left: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <div class="logo-mark"></div>
      <h1>aim3d Platform</h1>
    </div>
  </header>

  <!-- Fusion-style ribbon toolbar (mode switcher + workspace tabs + command groups) -->
  <div id="ribbon-mount" style="flex-shrink: 0; position: relative; z-index: 12;"></div>

  <div id="app">
    <!-- Left Sidebar: Parametric Timeline (Track A2) -->
    <div class="app-panel" id="timeline-panel">
      <!-- Vue will inject content here -->
    </div>

    <!-- Left Resizer -->
    <div class="resizer" id="left-resizer"></div>

    <!-- Center: WebGPU Viewport (Track B2) -->
    <div style="position: relative; width: 100%; height: 100%;" id="viewport-panel">
      <!-- Vue will inject content here -->
    </div>

    <!-- Right Resizer -->
    <div class="resizer" id="right-resizer"></div>

    <!-- Right Sidebar: Property Panel (Track B1) & Simulation Control -->
    <div class="app-panel right" id="property-panel">
      <!-- Vue will inject content here -->
    </div>
  </div>

  <!-- Bottom bar: parametric timeline -->
  <div id="timeline-bar"></div>

  <!-- Disconnected Overlay -->
  <div id="disconnect-overlay" style="display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; backdrop-filter: blur(4px); justify-content: center; align-items: center;">
    <div style="background: var(--bg-panel); padding: 32px; border: 1px solid var(--border-color); border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      <h2 style="margin-top: 0; color: var(--text-danger);">Connection Lost</h2>
      <p style="color: var(--text-muted); margin-bottom: 0;">Waiting for Headless Core to reconnect...</p>
    </div>
  </div>

  <script src="/aim3d_core.js"></script>
  <script type="module" src="./src/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const app = document.getElementById('app');
      const leftResizer = document.getElementById('left-resizer');
      const rightResizer = document.getElementById('right-resizer');

      let isDraggingLeft = false;
      let isDraggingRight = false;

      leftResizer.addEventListener('mousedown', (e) => {
        isDraggingLeft = true;
        leftResizer.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
      });

      rightResizer.addEventListener('mousedown', (e) => {
        isDraggingRight = true;
        rightResizer.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
      });

      document.addEventListener('mousemove', (e) => {
        if (isDraggingLeft) {
          const newWidth = Math.max(150, Math.min(500, e.clientX));
          app.style.setProperty('--left-panel-width', `${newWidth}px`);
          window.dispatchEvent(new Event('resize'));
        } else if (isDraggingRight) {
          const newWidth = Math.max(200, Math.min(600, window.innerWidth - e.clientX));
          app.style.setProperty('--right-panel-width', `${newWidth}px`);
          window.dispatchEvent(new Event('resize'));
        }
      });

      document.addEventListener('mouseup', () => {
        if (isDraggingLeft) {
          isDraggingLeft = false;
          leftResizer.classList.remove('dragging');
        }
        if (isDraggingRight) {
          isDraggingRight = false;
          rightResizer.classList.remove('dragging');
        }
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      });
    });
  </script>
</body>
</html>
