# Continuous integration for aim3d.
#
# Runs automatically on every push and pull request. Two independent jobs:
#
#   frontend-tests  — fast (≈1 min), no GPU required. Runs the pure-JS SDF/IoU
#                     reference tests and the WGSL parity drift guard
#                     (`make test-voxelizer`), plus the real-shader WebGPU
#                     voxelizer test (`make test-webgpu`) in headless Chromium.
#                     The WebGPU test skips cleanly (does not fail) on runners
#                     without a WebGPU backend.
#
#   core-tests      — slower (first run builds OpenCASCADE via Emscripten, then
#                     the C++ core test binary). Runs the full C++ gtest suite
#                     (`make test-core`) covering gcode parsing, motion planning,
#                     canned cycles, and the material-simulator C-API. Aggressively
#                     caches the emsdk, the OCCT build, and the core build so
#                     subsequent runs only recompile changed sources.
#
# Both jobs must pass for a PR to be mergeable. The frontend job is the fast
# gate; the core job is the comprehensive gate.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: # allow manual runs from the Actions tab

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Frontend (vitest + WebGPU voxelizer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('ui/frontend/package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium (for the real-shader WebGPU test)
        # No-op on a cache hit. The WebGPU test skips cleanly (does not fail) if the
        # runner has no WebGPU backend (e.g. headless Linux without SwiftShader).
        run: npx playwright install chromium
      # GPU-free reference + parity tests (sdSweptTool IoU, WGSL drift guard).
      - name: Run voxelizer tests (no GPU)
        run: npm run test:voxelizer

      # Real-shader test: launches headless Chromium with WebGPU and compares the
      # GPU density grid against the JS reference. Skips cleanly if WebGPU is
      # unavailable on the runner (SwiftShader software rendering is requested).
      - name: Run real-shader WebGPU test
        run: npm run test:webgpu

  core-tests:
    name: C++ core (Emscripten + OCCT, ctest)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # third_party/OCCT is a git submodule required to build OpenCASCADE.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # The Emscripten test binary (aim3d_core_tests.js) is executed by ctest
          # via node, so node must be on PATH.

      - name: Capture OCCT submodule SHA (cache key)
        id: occt-sha
        run: |
          sha=$(git submodule status third_party/OCCT | awk '{print $1}' | sed 's/^[-+]//')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "OCCT submodule SHA: $sha"

      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: .emsdk
          key: emsdk-${{ runner.os }}-latest

      - name: Cache OCCT build
        uses: actions/cache@v4
        with:
          path: |
            build/occt
            build/occt-install
          key: occt-${{ runner.os }}-${{ steps.occt-sha.outputs.sha }}-${{ hashFiles('core/CMakeLists.txt', 'CMakeLists.txt', 'Makefile') }}
          restore-keys: |
            occt-${{ runner.os }}-${{ steps.occt-sha.outputs.sha }}-

      - name: Cache core build
        uses: actions/cache@v4
        with:
          path: |
            build/bin
            build/core
            build/CMakeFiles
            build/CMakeCache.txt
            build/Makefile
            build/lib
          key: core-${{ runner.os }}-${{ steps.occt-sha.outputs.sha }}-${{ hashFiles('core/**/*.cpp', 'core/**/*.hpp', 'core/**/*.txt', 'core/CMakeLists.txt', 'CMakeLists.txt') }}

      - name: Install Emscripten
        run: make emsdk

      - name: Build and run C++ core tests
        run: make test-core OCCT_BUILD_JOBS=4
